<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Decorative Glow Orbs -->
  <circle cx="150" cy="100" r="250" fill="#7c3aed" opacity="0.15" filter="url(#ogGlow)" />
  <circle cx="1050" cy="500" r="300" fill="#3b82f6" opacity="0.15" filter="url(#ogGlow)" />

  <!-- Logo Container Box -->
  <g transform="translate(100, 165)">
    <rect width="300" height="300" rx="60" fill="url(#purpleGrad)" opacity="0.2" border="1px solid #7c3aed" />
    <!-- Book Wings -->
    <path d="M 150 210 C 120 190, 70 190, 40 205 L 40 100 C 70 85, 120 85, 150 105 Z" fill="url(#purpleGrad)" />
    <path d="M 150 210 C 180 190, 230 190, 260 205 L 260 100 C 230 85, 180 85, 150 105 Z" fill="url(#blueGrad)" />
    <circle cx="150" cy="75" r="20" fill="#fb7185" />
  </g>

  <!-- Text Header -->
  <g transform="translate(460, 230)">
    <!-- Badge -->
    <rect x="0" y="-45" width="280" height="36" rx="18" fill="#7c3aed" opacity="0.2" stroke="#a855f7" stroke-width="1" />
    <text x="140" y="-22" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#c084fc" text-anchor="middle" letter-spacing="2">
      NEXT-GEN SAAS LMS
    </text>

    <!-- Title -->
    <text x="0" y="35" font-family="'Segoe UI', system-ui, sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-1">
      EduCore LMS
    </text>

    <!-- Subtitle -->
    <text x="0" y="85" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="600" fill="#94a3b8">
      Empowering Education with AI &amp; Real-Time Analytics
    </text>

    <!-- Bullet Points -->
    <g transform="translate(0, 135)" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#cbd5e1">
      <text x="0" y="0">✨ Interactive Video Lessons</text>
      <text x="240" y="0">⚡ Live Quizzes &amp; Certificates</text>
      <text x="500" y="0">🤖 AI Study Assistant</text>
    </g>
  </g>
</svg>
